<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="tabBgGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8F4EE" />
      <stop offset="100%" stop-color="#E9DCCB" />
    </radialGradient>
    <linearGradient id="tabPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CAC5" />
      <stop offset="60%" stop-color="#DDB9B4" />
      <stop offset="100%" stop-color="#CDAE91" />
    </linearGradient>
    <linearGradient id="tabHookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E563B" />
      <stop offset="60%" stop-color="#563A29" />
      <stop offset="100%" stop-color="#3A2417" />
    </linearGradient>
    <linearGradient id="tabLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BDC6AA" />
      <stop offset="60%" stop-color="#A4AD91" />
      <stop offset="100%" stop-color="#7A8466" />
    </linearGradient>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#tabBgGrad)" stroke="#E9DCCB" stroke-width="12"/>
  
  <!-- Leaves (Bold for small icon visibility) -->
  <path d="M 270 280 C 220 280 180 320 180 360 C 220 370 260 330 270 280 Z" fill="url(#tabLeafGrad)" />
  <path d="M 330 250 C 380 250 410 290 400 330 C 360 335 335 295 330 250 Z" fill="url(#tabLeafGrad)" />

  <!-- Yarn Skein (High contrast) -->
  <circle cx="170" cy="320" r="76" fill="#F8F4EE" stroke="#E9DCCB" stroke-width="6" />
  <circle cx="170" cy="320" r="76" fill="url(#tabPetalGrad)" opacity="0.4" />
  <path d="M -54 -30 C -20 -60 20 -60 54 -30 C 20 0 -20 0 -54 -30 Z" transform="translate(170, 320)" fill="none" stroke="#CDAE91" stroke-width="12" stroke-linecap="round"/>
  <path d="M -65 0 C -30 -35 30 -35 65 0 C 30 35 -30 35 -65 0 Z" transform="translate(170, 320)" fill="none" stroke="#DDB9B4" stroke-width="14" stroke-linecap="round"/>
  <path d="M -54 30 C -20 0 20 0 54 30 C 20 60 -20 60 -54 30 Z" transform="translate(170, 320)" fill="none" stroke="#563A29" stroke-width="9" stroke-linecap="round" opacity="0.8"/>

  <!-- Yarn Thread Uncoiling -->
  <path d="M 230 300 C 300 280 320 210 270 170 C 240 145 225 180 250 205 C 275 230 310 170 310 130" 
        fill="none" stroke="#CDAE91" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crochet Hook -->
  <g transform="translate(140, 240) rotate(-35)">
    <rect x="-14" y="60" width="28" height="150" rx="14" fill="url(#tabHookGrad)" stroke="#3A2417" stroke-width="3"/>
    <rect x="-6" y="-20" width="12" height="85" rx="4" fill="#CDAE91"/>
    <path d="M -6 -20 C -6 -45 -1 -55 -1 -65 C -1 -75 -12 -70 -12 -60 C -12 -50 0 -40 4 -20 Z" fill="#CDAE91"/>
  </g>

  <!-- Blooming Crochet Flower -->
  <g transform="translate(320, 150)">
    <circle cx="0" cy="0" r="68" fill="url(#tabPetalGrad)" opacity="0.35" />
    <path d="M -30 -20 C -50 -70 50 -70 30 -20 Z" fill="url(#tabPetalGrad)" stroke="#F8F4EE" stroke-width="5"/>
    <path d="M 20 -30 C 70 -50 70 50 20 30 Z" fill="url(#tabPetalGrad)" stroke="#F8F4EE" stroke-width="5"/>
    <path d="M 15 25 C 50 65 -15 80 -25 35 Z" fill="url(#tabPetalGrad)" stroke="#F8F4EE" stroke-width="5"/>
    <path d="M -25 30 C -70 50 -70 -20 -30 -15 Z" fill="url(#tabPetalGrad)" stroke="#F8F4EE" stroke-width="5"/>
    <circle cx="0" cy="0" r="16" fill="#563A29" stroke="#E9DCCB" stroke-width="4"/>
    <circle cx="0" cy="0" r="4" fill="#F8F4EE"/>
  </g>
</svg>
