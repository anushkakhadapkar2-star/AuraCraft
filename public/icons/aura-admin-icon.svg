<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Chocolate Gradient -->
    <linearGradient id="adminBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#563A29" />
      <stop offset="50%" stop-color="#422C1E" />
      <stop offset="100%" stop-color="#281A12" />
    </linearGradient>

    <!-- Metallic Gold/Tan Gradient for Crest -->
    <linearGradient id="tanMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F4EE" />
      <stop offset="35%" stop-color="#E9DCCB" />
      <stop offset="70%" stop-color="#CDAE91" />
      <stop offset="100%" stop-color="#A48265" />
    </linearGradient>

    <!-- Warm Ivory Gradient -->
    <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E9DCCB" />
    </linearGradient>

    <!-- Sage Green Beacon Pulse -->
    <radialGradient id="beaconGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5D1B3" />
      <stop offset="40%" stop-color="#A4AD91" />
      <stop offset="100%" stop-color="#6F795C" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="adminShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#CDAE91" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Dark Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#adminBgGrad)" stroke="#CDAE91" stroke-width="4" stroke-opacity="0.6" filter="url(#adminShadow)" />
  
  <!-- Subtle Internal Security Grid / Concentric Lines -->
  <rect x="42" y="42" width="428" height="428" rx="112" fill="none" stroke="#E9DCCB" stroke-width="1" stroke-dasharray="8 8" opacity="0.15" />
  
  <!-- Outer Hexagonal / Faceted Shield Shield Crest -->
  <path d="M 256 76 
           L 396 156 
           L 396 316 
           L 256 424 
           L 116 316 
           L 116 156 Z" 
        fill="#362318" 
        stroke="url(#tanMetallic)" 
        stroke-width="5" 
        filter="url(#emblemGlow)" />

  <path d="M 256 94 
           L 378 164 
           L 378 306 
           L 256 400 
           L 134 306 
           L 134 164 Z" 
        fill="none" 
        stroke="#E9DCCB" 
        stroke-width="1.5" 
        opacity="0.35" />

  <!-- Monogram Intertwined "AC" Craft Architecture -->
  <g filter="url(#emblemGlow)">
    <!-- Stylized "A" Triangle & Apex -->
    <path d="M 256 128 L 332 300 L 296 300 L 278 256 L 234 256 L 216 300 L 180 300 Z" 
          fill="url(#tanMetallic)" />
    
    <!-- "A" Inner Counter Triangle -->
    <path d="M 256 182 L 242 228 L 270 228 Z" fill="#362318" />

    <!-- Stylized Intersecting "C" Ribbon -->
    <path d="M 334 220 
             C 342 195 330 165 298 155 
             C 256 142 208 170 198 220 
             C 188 270 224 322 278 322 
             C 316 322 340 295 344 272 
             L 310 264 
             C 306 278 294 294 274 294 
             C 244 294 226 264 230 234 
             C 234 204 258 178 288 184 
             C 304 187 312 200 316 214 Z" 
          fill="url(#ivoryGrad)" 
          opacity="0.95" />

    <!-- Central 4-Point Artisan Compass Star / Needle Spark -->
    <path d="M 256 220 Q 256 238 238 238 Q 256 238 256 256 Q 256 238 274 238 Q 256 238 256 220 Z" 
          fill="#FFFFFF" />
    <circle cx="256" cy="238" r="3" fill="#563A29" />
  </g>

  <!-- Real-time Live Beacon Indicator at Apex -->
  <g>
    <!-- Outer Glow Wave -->
    <circle cx="256" cy="76" r="14" fill="#A4AD91" opacity="0.3" />
    <!-- Inner Solid Pulse Gem -->
    <circle cx="256" cy="76" r="7" fill="url(#beaconGrad)" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Modern SaaS "ADMIN" Engraved Pill at Lower Base -->
  <g transform="translate(186, 352)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="#24160E" stroke="#CDAE91" stroke-width="2" opacity="0.95" />
    <text x="70" y="22" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="13" 
          letter-spacing="3" 
          fill="#E9DCCB">
      ADMIN
    </text>
  </g>
</svg>

