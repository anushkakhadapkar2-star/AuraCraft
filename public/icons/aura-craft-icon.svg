<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Warm Ivory to Sand Beige) -->
    <radialGradient id="iconBgGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8F4EE" />
      <stop offset="100%" stop-color="#E9DCCB" />
    </radialGradient>

    <!-- Dusty Rose Petal & Yarn Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CAC5" />
      <stop offset="60%" stop-color="#DDB9B4" />
      <stop offset="100%" stop-color="#CDAE91" />
    </linearGradient>

    <!-- Crochet Hook Wooden Grip Gradient -->
    <linearGradient id="hookWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E563B" />
      <stop offset="50%" stop-color="#563A29" />
      <stop offset="100%" stop-color="#3A2417" />
    </linearGradient>

    <!-- Metallic Golden Hook Shank Gradient -->
    <linearGradient id="hookMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFD2C4" />
      <stop offset="60%" stop-color="#CDAE91" />
      <stop offset="100%" stop-color="#B39374" />
    </linearGradient>

    <!-- Sage Green Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BDC6AA" />
      <stop offset="60%" stop-color="#A4AD91" />
      <stop offset="100%" stop-color="#7A8466" />
    </linearGradient>
  </defs>

  <!-- Canvas Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#iconBgGrad)" stroke="#E9DCCB" stroke-width="6"/>
  <!-- Stitched Perimeter Ring -->
  <rect x="42" y="42" width="428" height="428" rx="106" fill="none" stroke="#CDAE91" stroke-width="2.5" stroke-dasharray="9 9" opacity="0.45"/>

  <!-- SAGE CROCHET LEAVES (Sprouting from yarn) -->
  <g id="crochet-leaves">
    <!-- Left Leaf -->
    <path d="M 270 280 C 220 280 180 320 180 360 C 220 370 260 330 270 280 Z" fill="url(#leafGrad)" opacity="0.95" />
    <path d="M 215 330 Q 235 315 255 295" stroke="#F8F4EE" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Right Leaf -->
    <path d="M 330 250 C 380 250 410 290 400 330 C 360 335 335 295 330 250 Z" fill="url(#leafGrad)" opacity="0.9" />
    <path d="M 355 275 Q 375 295 385 315" stroke="#F8F4EE" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- TEXTURED YARN SKEIN BALL (Bottom-Left) -->
  <g id="yarn-skein" transform="translate(170, 320)">
    <!-- Base Yarn Core -->
    <circle cx="0" cy="0" r="76" fill="#F8F4EE" stroke="#E9DCCB" stroke-width="4" />
    <circle cx="0" cy="0" r="76" fill="url(#petalGrad)" opacity="0.45" />

    <!-- Helical Woven Strands -->
    <path d="M -54 -30 C -20 -60 20 -60 54 -30 C 20 0 -20 0 -54 -30 Z" fill="none" stroke="#CDAE91" stroke-width="9" stroke-linecap="round"/>
    <path d="M -65 0 C -30 -35 30 -35 65 0 C 30 35 -30 35 -65 0 Z" fill="none" stroke="#DDB9B4" stroke-width="11" stroke-linecap="round"/>
    <path d="M -54 30 C -20 0 20 0 54 30 C 20 60 -20 60 -54 30 Z" fill="none" stroke="#563A29" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <path d="M -40 -50 C 0 -20 40 20 20 65" fill="none" stroke="#F8F4EE" stroke-width="6" stroke-linecap="round"/>
    <path d="M -20 -65 C 20 -20 50 10 40 55" fill="none" stroke="#CDAE91" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- CONTINUOUS YARN THREAD UNCOILING INTO BLOOM -->
  <g id="yarn-thread">
    <path d="M 230 300 C 300 280 320 210 270 170 C 240 145 225 180 250 205 C 275 230 310 170 310 130" 
          fill="none" stroke="#CDAE91" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 230 300 C 300 280 320 210 270 170 C 240 145 225 180 250 205 C 275 230 310 170 310 130" 
          fill="none" stroke="#F8F4EE" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
  </g>

  <!-- ARTISAN CROCHET HOOK (Slanted Ergonomic Tool) -->
  <g id="crochet-hook" transform="translate(140, 240) rotate(-35)">
    <!-- Polished Wooden Handle -->
    <rect x="-14" y="60" width="28" height="150" rx="14" fill="url(#hookWoodGrad)" stroke="#3A2417" stroke-width="2"/>
    <circle cx="0" cy="110" r="5" fill="#CDAE91" />
    
    <!-- Metallic Brass Shank -->
    <rect x="-6" y="-20" width="12" height="85" rx="4" fill="url(#hookMetalGrad)" />
    
    <!-- Tapered Throat & Ergonomic Hook Barb -->
    <path d="M -6 -20 C -6 -45 -1 -55 -1 -65 C -1 -75 -12 -70 -12 -60 C -12 -50 0 -40 4 -20 Z" fill="url(#hookMetalGrad)" stroke="#B39374" stroke-width="1.5"/>
  </g>

  <!-- CROCHET BLOOMING FLOWER (Top Right) -->
  <g id="crochet-flower" transform="translate(320, 150)">
    <!-- Outer Petal Aura -->
    <circle cx="0" cy="0" r="68" fill="url(#petalGrad)" opacity="0.35" />
    
    <!-- Layered Petals with Stitched Contour -->
    <path d="M -30 -20 C -50 -70 50 -70 30 -20 Z" fill="url(#petalGrad)" stroke="#F8F4EE" stroke-width="4"/>
    <path d="M 20 -30 C 70 -50 70 50 20 30 Z" fill="url(#petalGrad)" stroke="#F8F4EE" stroke-width="4"/>
    <path d="M 15 25 C 50 65 -15 80 -25 35 Z" fill="url(#petalGrad)" stroke="#F8F4EE" stroke-width="4"/>
    <path d="M -25 30 C -70 50 -70 -20 -30 -15 Z" fill="url(#petalGrad)" stroke="#F8F4EE" stroke-width="4"/>
    
    <!-- Inner Rose Swirl (Textured Crochet Core) -->
    <path d="M -20 -10 C -15 -35 25 -35 20 -5 C 15 20 -20 20 -15 -5 C -10 -15 10 -15 5 -5" 
          fill="none" stroke="#563A29" stroke-width="5.5" stroke-linecap="round"/>
    
    <!-- Center Artisan Button -->
    <circle cx="0" cy="0" r="14" fill="#563A29" stroke="#E9DCCB" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#F8F4EE"/>
  </g>

  <!-- Artisan Sparks -->
  <path d="M 390 80 Q 390 95 375 95 Q 390 95 390 110 Q 390 95 405 95 Q 390 95 390 80 Z" fill="#CDAE91" />
  <path d="M 120 160 Q 120 170 110 170 Q 120 170 120 180 Q 120 170 130 170 Q 120 170 120 160 Z" fill="#DDB9B4" />
</svg>
