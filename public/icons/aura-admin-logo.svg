<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" width="100%" height="100%">
  <defs>
    <linearGradient id="adLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#563A29" />
      <stop offset="100%" stop-color="#2D1C13" />
    </linearGradient>
    <linearGradient id="adGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F4EE" />
      <stop offset="60%" stop-color="#CDAE91" />
      <stop offset="100%" stop-color="#9E7E62" />
    </linearGradient>
    <radialGradient id="adPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5D1B3" />
      <stop offset="50%" stop-color="#A4AD91" />
      <stop offset="100%" stop-color="#556441" />
    </radialGradient>
  </defs>

  <!-- Left Shield Emblem -->
  <g transform="translate(10, 6) scale(0.133)">
    <!-- Base Squircle -->
    <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#adLogoBg)" stroke="#CDAE91" stroke-width="8" stroke-opacity="0.7" />
    
    <!-- Shield -->
    <path d="M 256 76 L 396 156 L 396 316 L 256 424 L 116 316 L 116 156 Z" 
          fill="#362318" stroke="url(#adGold)" stroke-width="12" />

    <!-- "A" & "C" Monogram -->
    <path d="M 256 128 L 332 300 L 296 300 L 278 256 L 234 256 L 216 300 L 180 300 Z" fill="url(#adGold)" />
    <path d="M 256 182 L 242 228 L 270 228 Z" fill="#362318" />

    <path d="M 334 220 C 342 195 330 165 298 155 C 256 142 208 170 198 220 C 188 270 224 322 278 322 C 316 322 340 295 344 272 L 310 264 C 306 278 294 294 274 294 C 244 294 226 264 230 234 C 234 204 258 178 288 184 C 304 187 312 200 316 214 Z" 
          fill="#F8F4EE" />

    <!-- Center Compass Star -->
    <circle cx="256" cy="238" r="8" fill="#FFFFFF" />

    <!-- Apex Beacon -->
    <circle cx="256" cy="76" r="16" fill="url(#adPulse)" stroke="#FFFFFF" stroke-width="4" />
  </g>

  <!-- Typography: AURA CRAFT -->
  <text x="92" y="42" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="1.5" 
        fill="#563A29">
    AURA CRAFT
  </text>
  
  <!-- Operations / Admin Badge -->
  <g transform="translate(94, 50)">
    <rect x="0" y="0" width="116" height="18" rx="9" fill="#563A29" />
    <circle cx="9" cy="9" r="3.5" fill="#A4AD91" />
    <text x="62" y="12.5" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="8.5" 
          font-weight="800" 
          letter-spacing="2" 
          fill="#FAF7F2">
      OPERATIONS
    </text>
  </g>
</svg>

